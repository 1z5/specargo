name: unit-tests

# 离线测试：不需要集群、不需要 API key、不需要 Docker。
# 与 k8s-smoke 互补——smoke 验证集群编排，本 job 守护代码正确性
#（此前 32+ 个用例只在本地手动跑，改坏 state.py 的 SQL 集群冒烟依然是绿的）。
on:
  push:
    paths: ["app/**", "pipelines/**", "tests/**", ".github/workflows/unit-tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 是常见生产下限；3.12 与 Dockerfile / Dockerfile.ci 保持一致
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 只装编排层依赖：测试不需要 openai / faster-whisper 这些重依赖
      # （tts_client 的 openai 导入是延迟的，service/runner/spec/state/checks 全部可离线导入）
      - name: 安装依赖
        run: |
          set -e
          python3 -m pip install --upgrade pip
          python3 -m pip install "PyYAML>=6.0"

      - name: 校验无隐式依赖（import 全部 app 模块）
        run: |
          set -e
          cd app
          for m in spec runner state checks checks_tts resume metrics argo_io objstore summary notify; do
            python3 -c "import $m" || { echo "❌ $m 导入失败（缺依赖？）"; exit 1; }
          done
          echo "✅ 全部模块可离线导入"

      - name: 跑离线测试（三个套件）
        run: |
          set -e
          total=0
          for f in tests/test_framework.py tests/test_resume_state.py \
                   tests/test_service_and_storage.py; do
            echo "=========== $f ==========="
            python3 "$f"
          done

      - name: 校验 pipeline 定义可加载（严格模式）
        run: |
          set -e
          cd app
          for f in ../pipelines/*.yaml; do
            echo "--- $f ---"
            python3 -c "
          import sys
          sys.path.insert(0, '.')
          from spec import load_spec
          s = load_spec('$f')
          print(f'  ✓ {s.name}: {len(s.stages)} stages, {len(s.partitions)} partitions')
          "
          done

      - name: runner dry-run（渲染全部命令，验证模板无未定义变量）
        run: |
          set -e
          cd app
          python3 runner.py ../pipelines/etl-demo.yaml --dry-run 2>&1 | head -20

      - name: 编译 pipeline 定义成 Argo CRD（spec2argo）
        run: |
          set -e
          mkdir -p /tmp/compiled
          for f in pipelines/*.yaml; do
            echo "--- 编译 $f ---"
            python3 app/spec2argo.py "$f" -o "/tmp/compiled/$(basename "$f")"
          done

      - name: lint 全部 k8s 编排（schema 级校验）
        run: |
          set -e
          ARGO_VERSION=v3.7.18
          curl -sSL -o /tmp/argo.gz \
            "https://github.com/argoproj/argo-workflows/releases/download/${ARGO_VERSION}/argo-linux-amd64.gz"
          gunzip -f /tmp/argo.gz
          chmod +x /tmp/argo
          for f in k8s/*.yaml /tmp/compiled/*.yaml; do
            # object-store / artifact-repository 是原生 K8s 资源，argo lint 不认识，跳过
            case "$f" in
              *object-store.yaml|*artifact-repository.yaml) continue ;;
            esac
            echo "--- $f ---"
            /tmp/argo lint --offline "$f"
          done
