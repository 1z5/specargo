name: unit-tests

# 离线测试：不需要集群、不需要 API key、不需要 Docker。
# 与 k8s-smoke 互补——smoke 验证集群编排，本 job 守护代码正确性。
on:
  push:
    paths: ["src/**", "examples/**", "pipelines/**", "tests/**", "k8s/**",
            "Dockerfile", ".github/workflows/unit-tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 是常见生产下限；3.12 与 Dockerfile 保持一致
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 只装框架层依赖：测试不需要领域示例的重依赖（openai / faster-whisper 等，
      # 它们都在 examples/ 下且导入是延迟的）
      - name: 安装依赖
        run: |
          set -e
          python3 -m pip install --upgrade pip
          python3 -m pip install "PyYAML>=6.0"
          # 包化后以 editable install 验证「pip install 可用」这条属性
          python3 -m pip install -e .
          python3 -c "import specargo; print('specargo', specargo.__version__)"

      - name: 框架层纯净度守卫（领域词不得泄漏到框架包）
        run: |
          set -e
          # envcompat.py / legacy_state_migration.py 是唯一的旧前缀兼容层，允许例外。
          MATCHES=$(grep -rniE '(^|[^A-Za-z0-9])(tts|asr|audiobook|narration|book|chapter|voice|audio|openai|speech|whisper|azure|cedar|marin)([^A-Za-z]|$)|音色|书籍|章节|语音|音频' src/ --exclude-dir='__pycache__' \
                    --exclude-dir='*.egg-info' \
                    | grep -vE 'src/specargo/(envcompat|legacy_state_migration)\.py' || true)
          if [ -n "$MATCHES" ]; then
            echo "❌ 框架层出现领域残留（应放到 examples/）："
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ 框架包无领域词泄漏"

      - name: 校验无隐式依赖（import 全部框架模块）
        run: |
          set -e
          for m in spec runner state checks resume metrics argo_io objstore spec2argo \
                   plugins envcompat legacy_state_migration journal pipeline_cli notify \
                   runtime subprocess_env cli; do
            python3 -c "import specargo.$m" || { echo "❌ $m 导入失败（缺依赖？）"; exit 1; }
          done
          for m in etl_steps dataset_steps manifest; do
            python3 -c "import specargo.examples.$m" || { echo "❌ 示例步骤 $m 导入失败"; exit 1; }
          done
          python3 -m specargo --help > /dev/null
          specargo --help > /dev/null
          echo "✅ 全部框架模块可离线导入（包化后）"

      - name: 跑框架离线测试（全部套件）
        run: |
          set -e
          for f in tests/test_*.py; do
            echo "=========== $f ==========="
            python3 "$f"
          done

      - name: 跑领域示例离线测试（不装重依赖）
        run: |
          set -e
          for f in examples/tts-asr/tests/test_*.py; do
            echo "=========== $f ==========="
            python3 "$f"
          done

      - name: 校验 pipeline 定义可加载（严格模式）
        run: |
          set -e
          for f in pipelines/*.yaml examples/tts-asr/pipelines/*.yaml; do
            echo "--- $f ---"
            python3 -c "
          from specargo.spec import load_spec
          s = load_spec('$f')
          print(f'  ✓ {s.name}: {len(s.stages)} stages, {len(s.partitions)} partitions, {len(s.plugins)} plugins')
          "
          done

      - name: 插件显式加载（领域示例）
        run: |
          set -e
          cd examples/tts-asr
          python3 -c "
          import _bootstrap, checks_tts
          from specargo.checks import available
          assert 'asr_three_state' in available(), '领域插件未注册'
          print('✅ 领域插件通过 spec.plugins 显式加载')
          "

      - name: runner 真跑一次真实 pipeline（不能只 dry-run）
        run: |
          set -e
          rm -rf /tmp/ci-run && mkdir -p /tmp/ci-run
          specargo-run pipelines/etl-demo.yaml \
            --state-db /tmp/ci-run/s.db --workdir /tmp/ci-run | tee /tmp/ci-run/out.txt
          # 对账必须全绿（曾出现"CI 绿但本地 pipeline 跑不通"的回归：
          # YAML 声明 app_dir: "" 而 Runner 用 setdefault 不覆盖 -> 渲染出 /etl_steps.py）
          grep -q "'ok': True" /tmp/ci-run/out.txt \
            || { echo "❌ pipeline 对账未通过"; exit 1; }

      - name: 断言渲染结果无空路径
        run: |
          set -e
          OUT=$(specargo-run pipelines/etl-demo.yaml --dry-run 2>&1)
          echo "$OUT" | head -6
          # 包化后业务命令应为 `-m specargo.examples.*`，不能再出现裸脚本路径
          if echo "$OUT" | grep -qE "python3 /[a-z_]+\.py"; then
            echo "❌ 命令里出现根目录脚本路径"
            exit 1
          fi
          echo "✅ 渲染路径正常"

      - name: 编译 pipeline 定义成 Argo CRD（spec2argo）
        run: |
          set -e
          mkdir -p /tmp/compiled
          for f in pipelines/*.yaml examples/tts-asr/pipelines/*.yaml; do
            echo "--- 编译 $f ---"
            specargo-compile "$f" -o "/tmp/compiled/$(basename "$f")"
          done

      - name: 断言编译产物无未解析模板变量（argo lint 不检查这个）
        run: |
          set -e
          # 编译器内部已做同一断言；这里作为 CI 层防线，防止断言被误删后回归。
          if grep -rInE '\{\{[[:space:]]*(params|partition)\.|\{\{artifact\}\}' /tmp/compiled/; then
            echo "❌ 编译产物残留 spec 模板变量"
            exit 1
          fi
          echo "✅ 编译产物零残留模板变量"

      - name: lint 全部 k8s 编排（schema 级校验）
        run: |
          set -e
          ARGO_VERSION=v3.7.18
          curl -sSL -o /tmp/argo.gz \
            "https://github.com/argoproj/argo-workflows/releases/download/${ARGO_VERSION}/argo-linux-amd64.gz"
          gunzip -f /tmp/argo.gz
          chmod +x /tmp/argo
          for f in k8s/*.yaml examples/tts-asr/k8s/*.yaml /tmp/compiled/*.yaml; do
            # object-store / artifact-repository 是原生 K8s 资源，argo lint 不认识，跳过
            case "$f" in
              *object-store.yaml|*artifact-repository.yaml) continue ;;
            esac
            echo "--- $f ---"
            /tmp/argo lint --offline "$f"
          done
