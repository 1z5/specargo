name: k8s-smoke

# 在真实 K8s 集群（kind）里冒烟测试 Argo Workflows 编排：
#   起集群 -> 装 Argo -> 构建镜像 -> submit DAG -> 断言跑通 -> 收集证据
# 这一步是为了把"未在真实集群跑过"变成"已在 CI 集群跑通"。
on:
  push:
    paths: ["k8s/**", "src/**", "pipelines/**", "examples/**", "Dockerfile",
            ".github/workflows/k8s-smoke.yml"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ---- 1. 起 kind 集群（K8s in Docker，单节点）----
      # kind-action 的 config 输入要的是文件路径，不是内联内容
      - name: 安装框架包（编译与断言都用 specargo）
        run: |
          set -e
          python3 -m pip install --upgrade pip
          python3 -m pip install "PyYAML>=6.0"
          python3 -m pip install -e .
          python3 -c "import specargo; print('specargo', specargo.__version__)"
          specargo --help > /dev/null

      - name: 写 kind 多节点配置
        run: |
          cat > /tmp/kind-config.yaml <<'YAML'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
          - role: worker
          - role: worker
          YAML
          cat /tmp/kind-config.yaml

      - name: 启动 kind 集群（1 控制面 + 2 worker）
        uses: helm/kind-action@v1
        with:
          cluster_name: specargo
          node_image: kindest/node:v1.29.0
          wait: 180s
          config: /tmp/kind-config.yaml

      - name: 确认集群可用（多节点）
        run: |
          kubectl cluster-info
          echo "--- 节点清单 ---"
          kubectl get nodes -o wide
          NODES=$(kubectl get nodes --no-headers | grep -c Ready)
          echo "Ready 节点数: $NODES"
          [ "$NODES" -ge 3 ] || { echo "❌ 期望至少 3 个 Ready 节点"; exit 1; }

      # ---- 2. 安装 Argo Workflows（生产主流 v3 线最后一个 minor）----
      - name: 安装 Argo Workflows v3.7.18
        run: |
          set -e
          kubectl create namespace argo
          kubectl apply -n argo -f \
            https://github.com/argoproj/argo-workflows/releases/download/v3.7.18/install.yaml
          # quick-start 之外的显式 RBAC：让 default SA 能在 argo namespace 里跑
          kubectl create rolebinding argo-default-admin -n argo \
            --clusterrole=admin --serviceaccount=argo:default || true
          kubectl wait --for=condition=available --timeout=300s \
            deployment/argo-server deployment/workflow-controller -n argo
          kubectl get pods -n argo

      # ---- 2. 部署 MinIO（S3 兼容对象存储）并配置 Argo artifact repository ----
      # 多节点集群下 hostPath / emptyDir 是节点本地的，跨 Pod 传数据必须走对象存储
      # ---- 2.5 造输入分区（ConfigMap：多节点下任何 Pod 都能读到）----
      - name: 创建 discover 输入 ConfigMap
        run: |
          set -e
          ARGS=""
          for p in 101 102 103 104 105; do
            ARGS="$ARGS --from-literal=$p.jsonl={\"seed\":$p}"
          done
          kubectl create configmap etl-input-partitions -n argo $ARGS \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "--- ConfigMap 内容 ---"
          kubectl get configmap etl-input-partitions -n argo -o jsonpath='{.data}'
          echo

      # ---- 3. 构建轻量镜像并加载进 kind ----
      - name: 构建并加载镜像
        run: |
          set -e
          docker build -f Dockerfile -t specargo:ci .
          kind load docker-image specargo:ci --name specargo
          echo "--- 镜像已加载 ---"

      # ---- 3.5 对象存储与 artifact repository（必须在镜像加载之后）----
      # 对象存储与 artifact repository（复用已加载的 specargo:ci 镜像，无外部依赖）
      - name: 部署对象存储与 artifact repository
        run: |
          set -e
          kubectl apply -f k8s/object-store.yaml
          kubectl apply -f k8s/artifact-repository.yaml
          kubectl rollout status deployment/object-store -n argo --timeout=180s
          # controller 启动时读取 artifact-repositories ConfigMap；若 ConfigMap 是后创建的，
          # 必须重启 controller 才会加载（否则 executor 报
          # "You need to configure artifact storage"）
          kubectl rollout restart deployment/workflow-controller -n argo
          kubectl rollout status deployment/workflow-controller -n argo --timeout=180s

          # moto 启动时是空的，需要显式建 bucket（MinIO 是在启动命令里 mkdir 的）
          echo "--- 创建 artifact bucket ---"
          kubectl exec -n argo deploy/object-store -- python3 -c "
          import boto3
          s3 = boto3.client('s3', endpoint_url='http://127.0.0.1:5000',
                            aws_access_key_id='test-access-key',
                            aws_secret_access_key='test-secret-key',
                            region_name='us-east-1')
          try:
              s3.create_bucket(Bucket='argo-artifacts')
              print('bucket argo-artifacts 已创建')
          except Exception as e:
              print('bucket 创建:', e)
          print('buckets:', [b['Name'] for b in s3.list_buckets()['Buckets']])
          "
          kubectl get pods -n argo -l app=object-store
          echo "--- artifact repository 配置 ---"
          kubectl get configmap artifact-repositories -n argo -o yaml | grep -A4 "s3:"


      # ---- 4. 提交工作流并等待结果（失败则 CI 变红）----
      # ---- 4. 从同一份 spec 编译出集群 workflow 并提交 ----
      # 关键：跑的是 pipelines/etl-demo.yaml 的编译产物，不是手写的第二份定义
      - name: 编译并提交 ETL DAG 到 Argo
        run: |
          set -e
          ARGO_VERSION=v3.7.18
          # 注意：release 资源名是 argo-linux-amd64.gz（压缩包），不是 argo-linux-amd64
          curl -sSL -o /tmp/argo.gz \
            "https://github.com/argoproj/argo-workflows/releases/download/${ARGO_VERSION}/argo-linux-amd64.gz"
          gunzip -f /tmp/argo.gz            # 得到 /tmp/argo
          chmod +x /tmp/argo
          /tmp/argo version
          mkdir -p /tmp/compiled

          # 编译产物（与 unit-tests 用的是同一个编译器）。
          # 仅 CI 覆盖 pod_gc_strategy=""：保留 Pod 以便后面做跨节点/数量断言，
          # 仓库里 pipelines/*.yaml 的默认行为仍是成功后清理（OnWorkflowSuccess）。
          python3 - <<'PY'
          import sys
          import yaml
          from specargo.spec import load_spec
          from specargo.spec2argo import compile_workflow

          spec = load_spec('pipelines/etl-demo.yaml')
          spec.k8s['pod_gc_strategy'] = ''
          wf = compile_workflow(spec)
          open('/tmp/compiled/etl-demo.yaml', 'w', encoding='utf-8').write(
              yaml.safe_dump(wf, allow_unicode=True, sort_keys=False, width=120))
          PY
          echo "--- 编译产物 template 清单 ---"
          python3 -c "
          import yaml
          d = yaml.safe_load(open('/tmp/compiled/etl-demo.yaml', encoding='utf-8'))
          print('  ', [t['name'] for t in d['spec']['templates']])
          "
          /tmp/argo lint -n argo /tmp/compiled/etl-demo.yaml
          /tmp/argo submit -n argo /tmp/compiled/etl-demo.yaml --watch

      # ---- 4.5 journal=on 冒烟：真实集群验证 onExit 对账路径 ----
      # 默认（journal off）路径在上面已断言；这里额外编译一份 k8s.journal: true 的
      # etl-demo，验证真实 Argo 下：
      #   - 每个 stage/gate 的状态日志写入对象存储
      #   - discover 写分区清单
      #   - onExit 模板能读取 {{workflow.status}} 并完成对账（对账失败→工作流失败）
      - name: 编译并提交 journal=on 变体（验证 onExit 对账）
        run: |
          set -e
          mkdir -p /tmp/compiled
          python3 - <<'PY'
          import sys
          import yaml
          from specargo.spec import load_spec
          from specargo.spec2argo import compile_workflow

          spec = load_spec('pipelines/etl-demo.yaml')
          spec.k8s['journal'] = True
          spec.k8s['pod_gc_strategy'] = ''   # 保留 Pod 便于断言 onExit/节点
          wf = compile_workflow(spec, name='etl-demo-journal')
          names = [t['name'] for t in wf['spec']['templates']]
          print('journal 编译产物 templates:', names)
          assert 'on-exit' in names, 'journal 产物缺少 on-exit'
          assert wf['spec'].get('onExit') == 'on-exit'
          text = yaml.safe_dump(wf, allow_unicode=True, sort_keys=False, width=120)
          assert 'PIPELINE_WORKFLOW_STATUS' in text, 'onExit 缺少 workflow.status 注入'
          open('/tmp/compiled/etl-demo-journal.yaml', 'w', encoding='utf-8').write(text)
          PY
          /tmp/argo lint -n argo /tmp/compiled/etl-demo-journal.yaml
          /tmp/argo submit -n argo /tmp/compiled/etl-demo-journal.yaml --watch

          echo "--- journal 变体最终状态 ---"
          PHASE=$(/tmp/argo get -n argo etl-demo-journal -o json \
                  | python3 -c "import sys,json;print(json.load(sys.stdin)['status']['phase'])")
          echo "journal 工作流最终状态: $PHASE"
          [ "$PHASE" = "Succeeded" ] || { echo "❌ journal 工作流未成功（onExit 对账失败会让工作流失败）"; exit 1; }

          # onExit 节点必须存在且成功（对账通过才会是 Succeeded）
          ONEXIT=$(/tmp/argo get -n argo etl-demo-journal -o json | python3 -c "
          import sys, json
          wf = json.load(sys.stdin)
          nodes = [n for n in wf['status']['nodes'].values()
                   if n.get('templateName') == 'on-exit']
          ok = sum(1 for n in nodes if n.get('phase') == 'Succeeded')
          print('{}/{}'.format(ok, len(nodes)))
          ")
          echo "onExit 节点成功数: $ONEXIT"
          [ "$ONEXIT" = "1/1" ] || { echo "❌ onExit 未成功: $ONEXIT"; exit 1; }

          # onExit 必须真的执行了对账（而不是空跑）：日志里要有 PASS 报告
          ONEXIT_POD=$(kubectl get pods -n argo \
                       -l workflows.argoproj.io/workflow=etl-demo-journal \
                       -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
                       | grep 'on-exit' | head -1)
          echo "onExit Pod: $ONEXIT_POD"
          kubectl logs -n argo "$ONEXIT_POD" | tee /tmp/evidence-onexit.log
          grep -q "对账结果: PASS" /tmp/evidence-onexit.log \
            || { echo "❌ onExit 没有输出对账 PASS（可能跳过了对账）"; exit 1; }

          # 状态日志与分区清单必须真实落盘（证明跨 Pod 状态登记生效）
          PARTS=$(/tmp/argo get -n argo etl-demo-journal -o json | python3 -c "
          import sys, json
          wf = json.load(sys.stdin)
          n = [x for x in wf['status']['nodes'].values()
               if x.get('templateName') == 'extract' and x.get('type') == 'Pod']
          print(len(n))
          ")
          EXPECT_STATUS=$((3 * PARTS))
          echo "journal 分区数: $PARTS（期望状态日志 = 3 stage × 分区 = $EXPECT_STATUS）"
          POD=$(kubectl get pods -n argo -l app=object-store \
                -o jsonpath='{.items[0].metadata.name}')
          kubectl cp ci/dump_objects.py argo/"$POD":/tmp/dump_objects.py
          OBJS=$(kubectl exec -n argo "$POD" -- python3 /tmp/dump_objects.py 2>/dev/null)
          STATUS_COUNT=$(echo "$OBJS" | grep -c "_status/")
          PARTITIONS=$(echo "$OBJS" | grep -c "_run/partitions.json")
          echo "状态日志对象数: $STATUS_COUNT"
          echo "分区清单对象数: $PARTITIONS"
          [ "$STATUS_COUNT" -ge "$EXPECT_STATUS" ] || { echo "❌ 状态日志对象不足: $STATUS_COUNT < $EXPECT_STATUS"; exit 1; }
          [ "$PARTITIONS" -ge 1 ] || { echo "❌ 缺少 partitions.json"; exit 1; }
          echo "✅ journal/onExit 冒烟通过：状态日志 + 分区清单 + onExit 对账"

      # ---- 4.6 集群 resume 冒烟：真实续跑必须跳过已完成的 stage ----
      # 做法：resume 变体跑成功（写状态）→ 删除 workflow（保留对象存储状态）
      #      → 同名重新提交 → 断言所有 stage 都打印「[resume] 已完成，跳过」。
      # 这是"集群断点续跑"唯一的真实验证方式：本地模拟验证不了 Pod/Argo 侧行为。
      - name: 提交 resume 变体并验证续跑跳过（真实集群）
        run: |
          set -e
          python3 - <<'PY'
          import sys
          import yaml
          sys.path.insert(0, 'src')
          from specargo.spec import load_spec
          from specargo.spec2argo import compile_workflow

          spec = load_spec('pipelines/etl-demo.yaml')
          spec.k8s = dict(spec.k8s)
          spec.k8s.update({'resume': True, 'journal': True, 'pod_gc_strategy': ''})
          wf = compile_workflow(spec, name='etl-demo-resume')
          text = yaml.safe_dump(wf, allow_unicode=True, sort_keys=False, width=120)
          assert 'state check-skip' in text, 'resume 产物缺少 check-skip'
          open('/tmp/compiled/etl-demo-resume.yaml', 'w', encoding='utf-8').write(text)
          PY
          /tmp/argo lint -n argo /tmp/compiled/etl-demo-resume.yaml

          echo "=== 第一轮：正常执行并登记状态 ==="
          /tmp/argo submit -n argo /tmp/compiled/etl-demo-resume.yaml --watch
          PHASE1=$(/tmp/argo get -n argo etl-demo-resume -o json \
                   | python3 -c "import sys,json;print(json.load(sys.stdin)['status']['phase'])")
          echo "第一轮状态: $PHASE1"
          [ "$PHASE1" = "Succeeded" ] || { echo "❌ 第一轮未成功"; exit 1; }

          echo "=== 删除 workflow（保留对象存储里的状态）==="
          /tmp/argo delete -n argo etl-demo-resume --force
          for _ in $(seq 1 30); do
            kubectl get workflow -n argo etl-demo-resume >/dev/null 2>&1 || break
            sleep 2
          done
          kubectl get workflow -n argo etl-demo-resume >/dev/null 2>&1 \
            && { echo "❌ 旧 workflow 未能删除，无法同名重提"; exit 1; }

          echo "=== 第二轮：同名重提，应全部跳过 ==="
          /tmp/argo submit -n argo /tmp/compiled/etl-demo-resume.yaml --watch
          PHASE2=$(/tmp/argo get -n argo etl-demo-resume -o json \
                   | python3 -c "import sys,json;print(json.load(sys.stdin)['status']['phase'])")
          echo "第二轮状态: $PHASE2"
          [ "$PHASE2" = "Succeeded" ] || { echo "❌ 第二轮未成功（resume 判定或跳过逻辑有问题）"; exit 1; }

          # 所有 stage Pod 的日志里都必须有 resume 跳过标记（stage×分区 数量对得上）
          SKIPPED=$(kubectl get pods -n argo \
                    -l workflows.argoproj.io/workflow=etl-demo-resume \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' \
                    | grep -E 'etl-demo-resume-(extract|transform|load)-' \
                    | while read -r pod; do
                        kubectl logs -n argo "$pod" 2>/dev/null | grep -c '\[resume\] .* 已完成，跳过' || true
                      done | awk '{s+=$1} END {print s+0}')
          PARTS=$(/tmp/argo get -n argo etl-demo-resume -o json | python3 -c "
          import sys, json
          wf = json.load(sys.stdin)
          n = [x for x in wf['status']['nodes'].values()
               if x.get('templateName') == 'extract' and x.get('type') == 'Pod']
          print(len(n))
          ")
          EXPECT_SKIP=$((3 * PARTS))
          echo "检测到 resume 跳过次数: $SKIPPED（期望 $EXPECT_SKIP = 3 stage × $PARTS 分区）"
          [ "$SKIPPED" -ge "$EXPECT_SKIP" ] || { echo "❌ 续跑没有跳过已完成的 stage"; exit 1; }

          echo "✅ 集群 resume 冒烟通过：第二轮全部跳过已完成的 stage"

      # ---- 4.7 WorkflowTemplate 冒烟：注册模板 → 提交引用 → 跑通 ----
      # 验证"工作流版本管理与发布"的最小闭环：同一份 spec 发布成模板，
      # 多份 Workflow 只引用模板（升级/回滚只改模板，不改提交侧）。
      - name: 发布 WorkflowTemplate 并提交引用它的 Workflow
        run: |
          set -e
          specargo-compile pipelines/etl-demo.yaml --as-template \
            -o /tmp/compiled/etl-demo-template.yaml
          python3 -c "
          import yaml
          d = yaml.safe_load(open('/tmp/compiled/etl-demo-template.yaml', encoding='utf-8'))
          assert d['kind'] == 'WorkflowTemplate', d['kind']
          print('模板:', d['metadata']['name'], '| templates:', len(d['spec']['templates']))
          "
          kubectl apply -f /tmp/compiled/etl-demo-template.yaml

          specargo-compile pipelines/etl-demo.yaml --as-template \
            --reference etl-via-template -o /tmp/compiled/etl-via-template.yaml
          python3 -c "
          import yaml
          d = yaml.safe_load(open('/tmp/compiled/etl-via-template.yaml', encoding='utf-8'))
          ref = d['spec']['workflowTemplateRef']
          print('引用模板:', ref['name'])
          assert d['spec'].get('workflowTemplateRef'), '引用 Workflow 缺少 workflowTemplateRef'
          "
          /tmp/argo lint -n argo /tmp/compiled/etl-via-template.yaml
          /tmp/argo submit -n argo /tmp/compiled/etl-via-template.yaml --watch

          PHASE=$(/tmp/argo get -n argo etl-via-template -o json \
                  | python3 -c "import sys,json;print(json.load(sys.stdin)['status']['phase'])")
          echo "模板引用 Workflow 状态: $PHASE"
          [ "$PHASE" = "Succeeded" ] || { echo "❌ 引用模板的 Workflow 未成功"; exit 1; }

          # 节点必须由模板展开（templateName 来自 WorkflowTemplate）
          NODES=$(/tmp/argo get -n argo etl-via-template -o json | python3 -c "
          import sys, json
          wf = json.load(sys.stdin)
          pods = [n for n in wf['status']['nodes'].values() if n.get('type') == 'Pod']
          print(len(pods))
          ")
          echo "模板展开的 Pod 节点数: $NODES"
          [ "$NODES" -ge 10 ] || { echo "❌ 模板没有展开出预期节点数"; exit 1; }
          echo "✅ WorkflowTemplate 冒烟通过：注册 → 引用 → 执行"

      # ---- 5. 收集证据（无论成败）----
      - name: 收集运行证据
        if: always()
        run: |
          set +e
          mkdir -p /tmp/evidence
          /tmp/argo list -n argo | tee /tmp/evidence/argo-list.txt
          /tmp/argo get -n argo @latest -o yaml > /tmp/evidence/workflow-latest.yaml 2>&1
          /tmp/argo get -n argo etl-demo -o yaml > /tmp/evidence/workflow-etl-demo.yaml 2>&1
          /tmp/argo get -n argo etl-demo-journal -o yaml > /tmp/evidence/workflow-etl-demo-journal.yaml 2>&1
          kubectl get pods -n argo -o wide | tee /tmp/evidence/pods.txt
          cp /tmp/evidence-onexit.log /tmp/evidence/onexit-log.txt 2>/dev/null || true
          kubectl get events -n argo --sort-by=.lastTimestamp | tail -40 \
            | tee /tmp/evidence/events.txt
          echo "--- 对象存储中的 artifact（路径契约产物）---"
          POD=$(kubectl get pods -n argo -l app=object-store \
               -o jsonpath='{.items[0].metadata.name}')
          kubectl cp ci/dump_objects.py argo/"$POD":/tmp/dump_objects.py
          kubectl exec -n argo "$POD" -- python3 /tmp/dump_objects.py \
            | tee /tmp/evidence/artifacts.txt

      - name: 上传证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-smoke-evidence
          path: /tmp/evidence/
          retention-days: 30

      # ---- 6. 硬断言：工作流必须成功，且每个分区都过检 ----
      - name: 断言结果
        run: |
          set -e
          PHASE=$(/tmp/argo get -n argo etl-demo -o json 2>/dev/null \
                  | python3 -c "import sys,json;print(json.load(sys.stdin)['status']['phase'])")
          echo "工作流最终状态: $PHASE"
          [ "$PHASE" = "Succeeded" ] || { echo "❌ 工作流未成功"; exit 1; }
          # 12 个 task 节点（4 阶段 × 3 分区）必须全部 Succeeded
          # 动态计算：不写死数量（分区数由 discover 决定，可能是 5 也可能是 50）
          OK=$(/tmp/argo get -n argo etl-demo -o json 2>/dev/null | python3 -c "
          import sys, json
          wf = json.load(sys.stdin)
          nodes = [n for n in wf['status']['nodes'].values()
                   if n['type'] == 'Pod' and n.get('templateName') != 'on-exit']
          succeeded = sum(1 for n in nodes if n['phase'] == 'Succeeded')
          print(f'{succeeded}/{len(nodes)}')
          ")
          echo "Pod 节点成功数: $OK"
          TOTAL=${OK#*/}; DONE=${OK%/*}
          [ "$DONE" = "$TOTAL" ] || { echo "❌ 并非所有 task 都成功: $OK"; exit 1; }

          # 动态工作流：分区数由 discover 决定，Pod 数也应随之推导，不写死
          echo "--- 动态扇出验证 ---"
          # workflow 名显式取主工作流（journal 冒烟之后 @latest 会指向 etl-demo-journal）
          WF_NAME=$(/tmp/argo get -n argo etl-demo -o json 2>/dev/null \
                    | python3 -c "import sys, json; print(json.load(sys.stdin)['metadata']['name'])")
          echo "workflow 名: $WF_NAME"
          PARTS=$(/tmp/argo get -n argo etl-demo -o json 2>/dev/null | python3 -c "
          import sys, json
          wf = json.load(sys.stdin)
          n = [x for x in wf['status']['nodes'].values()
               if x.get('templateName') == 'extract' and x.get('type') == 'Pod']
          print(len(n))
          ")
          echo "discover 发现并扇出的分区数: $PARTS"
          [ "$PARTS" -ge 3 ] || { echo "❌ 动态扇出分区数不足"; exit 1; }
          # 期望 Pod 数 = 1(discover) + 3 阶段 × 分区 + 3 gate × 分区
          # （编译产物含 gate 任务：extract/transform/load 各一个质量闸门）
          EXPECT=$((1 + 6 * PARTS))
          PODS=$(kubectl get pods -n argo -l workflows.argoproj.io/workflow="$WF_NAME" \
                 --no-headers 2>/dev/null | wc -l)
          echo "工作流 Pod 总数: $PODS（期望 $EXPECT = 1 discover + 6×$PARTS）"
          [ "$PODS" = "$EXPECT" ] || { echo "❌ 动态扇出数量不符"; exit 1; }

          # 跨节点调度：Pod 必须分布在多个节点上
          echo "--- 跨节点调度验证 ---"
          NODES_USED=$(kubectl get pods -n argo -l workflows.argoproj.io/workflow="$WF_NAME" \
                       -o jsonpath='{.items[*].spec.nodeName}' 2>/dev/null | tr ' ' '\n' | sort -u | wc -l)
          echo "Pod 分布到的节点数: $NODES_USED"
          [ "$NODES_USED" -ge 2 ] || { echo "❌ Pod 未跨节点分布"; exit 1; }

          # 对象存储：MinIO bucket 里必须有 artifact 落盘（证明跨 Pod 数据真走了 S3）
          echo "--- 对象存储 artifact 验证 ---"
          POD=$(kubectl get pods -n argo -l app=object-store -o jsonpath='{.items[0].metadata.name}')
          # moto 的 S3 数据在进程内存里，用 S3 API 列举 bucket 内的对象数
          # 复用 ci/dump_objects.py，输出 "total=N" 便于断言
          KEYS=$(kubectl exec -n argo "$POD" -- python3 /tmp/dump_objects.py 2>/dev/null \
                 | grep -oE "[0-9]+ objects" | grep -oE "^[0-9]+" \
                 | awk '{s+=$1} END {print s+0}')
          echo "对象存储中的 artifact 对象数: $KEYS"
          [ "$KEYS" -gt 0 ] || { echo "❌ artifact 未写入对象存储"; exit 1; }

          echo "✅ 集群冒烟通过：动态 DAG + 跨节点调度 + 对象存储 artifact + 质量闸门全部验证"
