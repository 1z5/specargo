# 通用 ETL 管线（框架化的第二个实例，证明与 TTS 无关）
# 没有任何 ASR/TTS 知识：用 schema + row_count 两个通用检查做质量闸门
name: etl-demo
description: 抽取 → 转换 → 校验 → 装载（纯通用，用于验证框架普适性）

params:
  python: python3        # 解释器可配置：容器里可能是 python
  state_db: ""            # 由 CLI 注入；空则只跑不登记
  run_id: ""              # 由 Runner 注入，YAML 不赋值
  app_dir: ""             # 由 Runner 注入（代码目录）
  work_dir: "out"         # 产物根目录：本地相对路径；集群由编译器注入 /output

# 集群执行目标：spec2argo 编译器读取这一段生成 Argo CRD
k8s:
  image: tts-argo:ci
  image_pull_policy: Never
  volumes:
    output: {hostPath: {path: /tmp/ci/output, type: DirectoryOrCreate}}
    input: {configMap: {name: etl-input-partitions}}
  mounts: {output: /output, input: /input}

partitions:
  # discover：跑哪些分区由数据决定，不写死在 YAML 里。
  # 同一条命令在本地（无 /input 时退化为 1..3）和集群（ConfigMap 挂载 5 个分区）都适用
  from: discover
  dataset: dwd_order
  command: |
    if ls /input/*.jsonl >/dev/null 2>&1; then
      ls /input/*.jsonl | xargs -n1 basename | sed 's/\.jsonl$//'
    else
      # 每行一个分区（JSON 数组转换按行切分；echo "1 2 3" 会被当成一个元素）
      printf "%s\n" 1 2 3
    fi

variants: [""]            # 单变体

stages:
  # ---- 抽取：产出 JSONL ----
  - name: extract
    command: "{{params.python}} {{params.app_dir}}/etl_steps.py extract --partition {{partition.key}} --out {{params.work_dir}}/extract/{{partition.key}}.jsonl"
    outputs: [raw]
    artifacts:
      raw: "{{params.work_dir}}/extract/{{partition.key}}.jsonl"
    checks: [file_nonempty, row_count]
    check_config:
      row_count: {min: 1}
    retry: {policy: OnTransientError, limit: 2, backoff: {duration: 30s, factor: 2}}
    timeout: 10m

  # ---- 转换：字段规范化 ----
  - name: transform
    command: "{{params.python}} {{params.app_dir}}/etl_steps.py transform --in {{params.work_dir}}/extract/{{partition.key}}.jsonl --out {{params.work_dir}}/transform/{{partition.key}}.jsonl"
    dependencies: [extract]
    outputs: [clean]
    consumes: [raw]                     # 消费 extract 的产物（集群侧由对象存储 get）
    artifacts:
      clean: "{{params.work_dir}}/transform/{{partition.key}}.jsonl"
    checks: [json_schema]
    check_config:
      json_schema: {required: [order_id, amount, dt]}
    retry: {limit: 0}      # 数据问题不重试
    timeout: 10m

  # ---- 装载：写入目标库（这里用落盘模拟）----
  - name: load
    command: "{{params.python}} {{params.app_dir}}/etl_steps.py load --in {{params.work_dir}}/transform/{{partition.key}}.jsonl --out {{params.work_dir}}/load/{{partition.key}}.done"
    dependencies: [transform]
    outputs: [marker]
    consumes: [clean]                    # 消费 transform 的产物
    artifacts:
      marker: "{{params.work_dir}}/load/{{partition.key}}.done"
    checks: [file_nonempty]
    timeout: 10m
