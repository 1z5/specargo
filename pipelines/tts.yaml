# TTS 内容管线（框架化的一个实例）
# 同一个 runner 也能跑 pipelines/etl-demo.yaml——领域差异全在 YAML 与检查插件里
name: tts
description: 批量 TTS 生成 + ASR 回检 + 对账

params:
  python: python3        # 解释器可配置：容器里可能是 python
  state_db: ""            # 由 CLI 注入；空则只跑不登记
  books_dir: "books"
  run_id: ""              # 由 Runner 注入（{{workflow.name}} 的对等物），YAML 不赋值
  app_dir: ""             # 由 Runner 注入（代码目录）

partitions:
  from: list              # list | range | discover
  items:
    - {dataset: book_a, key: book_a}
    - {dataset: book_b, key: book_b}

variants: ["cedar"]       # 音色；ETL 管线里可以是版本号/环境

stages:
  # ---- 生成：瞬时错误才重试（限流/网络/5xx）----
  - name: generate
    command: "{{params.python}} {{params.app_dir}}/main.py production {{params.books_dir}}/{{partition.key}}.json --voice {{partition.variant}}"
    inputs: [partition]
    outputs: [audio]
    artifacts:
      audio: "output/{{partition.key}}"
    retry:
      policy: OnTransientError
      limit: 3
      backoff: {duration: 1m, factor: 2, max_duration: 10m}
    timeout: 30m

  # ---- 校验：数据问题不重试（limit 0），不过检即阻断 ----
  - name: verify
    command: "{{params.python}} {{params.app_dir}}/verify_audio.py output/{{partition.key}} --run-id {{params.run_id}} --state-db {{params.state_db}}"
    dependencies: [generate]
    outputs: [report]
    artifacts:
      report: "output/{{partition.key}}/verify_report/report.json"
    checks: [asr_three_state]
    check_config:
      asr_three_state:
        target: "output/{{partition.key}}"
        min_accuracy: 0.90
    retry:
      limit: 0
    timeout: 20m
