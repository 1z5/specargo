# Golden 编译产物（由 tests/update_golden.py 生成，请勿手改）
# 用途：锁住 spec2argo 的编译行为——编译器变更必须显式更新 golden，
#       否则 tests/test_golden.py 会以 drift 失败（防止"顺手改坏了编译器"）。
# 比较按解析后的 YAML 结构进行（不受 dump 宽度/键序影响）。
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: tts-example
  namespace: argo
spec:
  entrypoint: main
  activeDeadlineSeconds: 1800
  ttlStrategy:
    secondsAfterCompletion: 3600
  serviceAccountName: default
  volumes: []
  templates:
  - name: main
    dag:
      tasks:
      - name: generate
        template: generate
        dependencies: []
        withParam: '[{"key": "book_example", "dataset": "book_example", "variant": "cedar"}]'
        arguments:
          parameters:
          - name: partition
            value: '{{item.key}}'
          - name: dataset
            value: '{{item.dataset}}'
          - name: variant
            value: '{{item.variant}}'
      - name: verify
        template: verify
        dependencies:
        - generate
        withParam: '[{"key": "book_example", "dataset": "book_example", "variant": "cedar"}]'
        arguments:
          parameters:
          - name: partition
            value: '{{item.key}}'
          - name: dataset
            value: '{{item.dataset}}'
          - name: variant
            value: '{{item.variant}}'
      - name: gate-verify
        template: gate-verify
        dependencies:
        - verify
        withParam: '[{"key": "book_example", "dataset": "book_example", "variant": "cedar"}]'
        arguments:
          parameters:
          - name: partition
            value: '{{item.key}}'
          - name: dataset
            value: '{{item.dataset}}'
          - name: variant
            value: '{{item.variant}}'
  - name: generate
    inputs:
      parameters:
      - name: partition
      - name: dataset
      - name: variant
    timeout: 30m
    container:
      image: specargo-tts-asr:latest
      imagePullPolicy: IfNotPresent
      command:
      - sh
      - -c
      args:
      - 'set -e

        python3 {{workflow.parameters.example_dir}}/pipeline.py --book {{workflow.parameters.example_dir}}/{{workflow.parameters.books_dir}}/{{inputs.parameters.partition}}.json
        --voice {{inputs.parameters.variant}} --state-db "{{workflow.parameters.state_db}}"

        # 路径契约：上游只负责把产物写到约定 key，不依赖编排器的 artifact 配对

        python3 -m specargo.objstore put --key "runs/$PIPELINE_RUN_ID/{{inputs.parameters.partition}}/audio.jsonl" --file
        ''output/{{inputs.parameters.partition}}'''
      env:
      - name: PIPELINE_RUN_ID
        value: '{{workflow.name}}'
      - name: OBJSTORE_ENDPOINT
        value: http://object-store.argo.svc.cluster.local:5000
    retryStrategy:
      limit: '3'
      retryPolicy: OnTransientError
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 10m
  - name: verify
    inputs:
      parameters:
      - name: partition
      - name: dataset
      - name: variant
    timeout: 20m
    container:
      image: specargo-tts-asr:latest
      imagePullPolicy: IfNotPresent
      command:
      - sh
      - -c
      args:
      - 'set -e

        python3 {{workflow.parameters.example_dir}}/verify_audio.py output/{{inputs.parameters.partition}} --run-id "{{workflow.name}}"
        --state-db "{{workflow.parameters.state_db}}"

        # 路径契约：上游只负责把产物写到约定 key，不依赖编排器的 artifact 配对

        python3 -m specargo.objstore put --key "runs/$PIPELINE_RUN_ID/{{inputs.parameters.partition}}/report.jsonl" --file
        ''output/{{inputs.parameters.partition}}/verify_report/report.json'''
      env:
      - name: PIPELINE_RUN_ID
        value: '{{workflow.name}}'
      - name: OBJSTORE_ENDPOINT
        value: http://object-store.argo.svc.cluster.local:5000
    retryStrategy:
      limit: '0'
      retryPolicy: OnFailure
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 10m
  - name: gate-verify
    inputs:
      parameters:
      - name: partition
      - name: dataset
      - name: variant
    timeout: 5m
    retryStrategy:
      limit: '0'
    container:
      image: specargo-tts-asr:latest
      imagePullPolicy: IfNotPresent
      command:
      - sh
      - -c
      args:
      - 'set -e

        python3 -m specargo.objstore get --key "runs/$PIPELINE_RUN_ID/{{inputs.parameters.partition}}/report.jsonl" --file
        ''output/{{inputs.parameters.partition}}/verify_report/report.json''

        cat > /tmp/gate_config.json <<''JSON''

        {

        "asr_three_state": {

        "target": "output/{{inputs.parameters.partition}}",

        "min_accuracy": 0.9

        }

        }

        JSON

        python3 -m specargo.pipeline_cli gate --stage verify --artifact ''output/{{inputs.parameters.partition}}/verify_report/report.json''
        --checks ''["asr_three_state"]'' --check-config-file /tmp/gate_config.json --run-id "$PIPELINE_RUN_ID"

        '
      env:
      - name: PIPELINE_RUN_ID
        value: '{{workflow.name}}'
      - name: OBJSTORE_ENDPOINT
        value: http://object-store.argo.svc.cluster.local:5000
      - name: PIPELINE_PLUGINS
        value: '["checks_tts"]'
      - name: PIPELINE_PLUGIN_PATH
        value: /app/examples/tts-asr
  podGC:
    strategy: OnWorkflowSuccess
  arguments:
    parameters:
    - name: python
      value: python3
    - name: state_db
      value: ''
    - name: books_dir
      value: data
    - name: example_dir
      value: ''
    - name: app_dir
      value: /app
