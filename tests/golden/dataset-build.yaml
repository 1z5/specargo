# Golden 编译产物（由 tests/update_golden.py 生成，请勿手改）
# 用途：锁住 spec2argo 的编译行为——编译器变更必须显式更新 golden，
#       否则 tests/test_golden.py 会以 drift 失败（防止"顺手改坏了编译器"）。
# 比较按解析后的 YAML 结构进行（不受 dump 宽度/键序影响）。
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: dataset-build
  namespace: argo
  annotations:
    specargo.dev/spec-version: '1'
spec:
  entrypoint: main
  activeDeadlineSeconds: 1800
  ttlStrategy:
    secondsAfterCompletion: 3600
  serviceAccountName: default
  volumes:
  - name: output
    hostPath:
      path: /tmp/ci/output
      type: DirectoryOrCreate
  - name: input
    configMap:
      name: etl-input-partitions
  templates:
  - name: main
    dag:
      tasks:
      - name: discover
        template: discover-scan
      - name: seed
        template: seed
        dependencies:
        - discover
        withParam: '{{tasks.discover.outputs.parameters.items}}'
        arguments:
          parameters:
          - name: partition
            value: '{{item.key}}'
          - name: dataset
            value: '{{item.dataset}}'
          - name: variant
            value: '{{item.variant}}'
      - name: clean
        template: clean
        dependencies:
        - discover
        - seed
        withParam: '{{tasks.discover.outputs.parameters.items}}'
        arguments:
          parameters:
          - name: partition
            value: '{{item.key}}'
          - name: dataset
            value: '{{item.dataset}}'
          - name: variant
            value: '{{item.variant}}'
      - name: gate-clean
        template: gate-clean
        dependencies:
        - clean
        - discover
        withParam: '{{tasks.discover.outputs.parameters.items}}'
        arguments:
          parameters:
          - name: partition
            value: '{{item.key}}'
          - name: dataset
            value: '{{item.dataset}}'
          - name: variant
            value: '{{item.variant}}'
      - name: shard
        template: shard
        dependencies:
        - discover
        - clean
        withParam: '{{tasks.discover.outputs.parameters.items}}'
        arguments:
          parameters:
          - name: partition
            value: '{{item.key}}'
          - name: dataset
            value: '{{item.dataset}}'
          - name: variant
            value: '{{item.variant}}'
      - name: gate-shard
        template: gate-shard
        dependencies:
        - shard
        - discover
        withParam: '{{tasks.discover.outputs.parameters.items}}'
        arguments:
          parameters:
          - name: partition
            value: '{{item.key}}'
          - name: dataset
            value: '{{item.dataset}}'
          - name: variant
            value: '{{item.variant}}'
  - name: discover-scan
    script:
      image: specargo:ci
      imagePullPolicy: Never
      command:
      - sh
      - -c
      args:
      - "set -e\nmkdir -p /tmp/out\nif ls /input/*.jsonl >/dev/null 2>&1; then\n  ls /input/*.jsonl | xargs -n1 basename |\
        \ sed 's/\\.jsonl$//'\nelse\n  printf \"%s\\n\" 1 2 3\nfi > /tmp/out/found.txt\npython3 - <<'PY' > /tmp/out/items.json\n\
        import json, os, re, sys\nlines = [l.strip() for l in open('/tmp/out/found.txt', encoding='utf-8') if l.strip()]\n\
        dataset = os.environ.get('SPEC_DATASET', '')\nvariants = json.loads(os.environ.get('SPEC_VARIANTS', '[\"\"]')) or\
        \ ['']\nbad = [k for k in lines if not re.fullmatch(r'[\\w.-]+', k)]\nif bad:\n    print(f'discover 输出含非法分区 key（只允许字母/数字/_.-）:\
        \ {bad[:5]}', file=sys.stderr)\n    sys.exit(1)\nitems = [{'key': k, 'dataset': dataset, 'variant': v}\n         for\
        \ k in lines for v in variants]\nprint(json.dumps(items, ensure_ascii=False))\nPY\n"
      env:
      - name: SPEC_DATASET
        value: raw_partition
      - name: SPEC_VARIANTS
        value: '[""]'
      volumeMounts: &id001
      - name: output
        mountPath: /output
      - name: input
        mountPath: /input
    outputs:
      parameters:
      - name: items
        valueFrom:
          path: /tmp/out/items.json
  - name: seed
    inputs:
      parameters:
      - name: partition
      - name: dataset
      - name: variant
    timeout: 60s
    container:
      image: specargo:ci
      imagePullPolicy: Never
      command:
      - sh
      - -c
      args:
      - 'set -e

        python3 -m specargo.examples.dataset_steps seed --partition {{inputs.parameters.partition}} --out /output/raw/{{inputs.parameters.partition}}.jsonl
        --rows 20

        # 路径契约：上游只负责把产物写到约定 key，不依赖编排器的 artifact 配对

        python3 -m specargo.objstore put --key "runs/$PIPELINE_RUN_ID/{{inputs.parameters.partition}}/raw.jsonl" --file ''/output/raw/{{inputs.parameters.partition}}.jsonl'''
      env:
      - name: PIPELINE_RUN_ID
        value: '{{workflow.name}}'
      - name: OBJSTORE_ENDPOINT
        value: http://object-store.argo.svc.cluster.local:5000
      volumeMounts: *id001
    retryStrategy:
      limit: '1'
      retryPolicy: OnFailure
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 10m
  - name: clean
    inputs:
      parameters:
      - name: partition
      - name: dataset
      - name: variant
    timeout: 60s
    container:
      image: specargo:ci
      imagePullPolicy: Never
      command:
      - sh
      - -c
      args:
      - 'set -e

        # 路径契约：从上游产物取数（经对象存储，与节点无关）

        python3 -m specargo.objstore get --key "runs/$PIPELINE_RUN_ID/{{inputs.parameters.partition}}/raw.jsonl" --file ''/output/raw/{{inputs.parameters.partition}}.jsonl''

        python3 -m specargo.examples.dataset_steps clean --in /output/raw/{{inputs.parameters.partition}}.jsonl --out /output/clean/{{inputs.parameters.partition}}.jsonl
        --quarantine /output/quarantine/{{inputs.parameters.partition}}.jsonl

        # 路径契约：上游只负责把产物写到约定 key，不依赖编排器的 artifact 配对

        python3 -m specargo.objstore put --key "runs/$PIPELINE_RUN_ID/{{inputs.parameters.partition}}/clean.jsonl" --file
        ''/output/clean/{{inputs.parameters.partition}}.jsonl'''
      env:
      - name: PIPELINE_RUN_ID
        value: '{{workflow.name}}'
      - name: OBJSTORE_ENDPOINT
        value: http://object-store.argo.svc.cluster.local:5000
      volumeMounts: *id001
    retryStrategy:
      limit: '0'
      retryPolicy: OnFailure
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 10m
  - name: gate-clean
    inputs:
      parameters:
      - name: partition
      - name: dataset
      - name: variant
    timeout: 5m
    retryStrategy:
      limit: '0'
    container:
      image: specargo:ci
      imagePullPolicy: Never
      command:
      - sh
      - -c
      args:
      - 'set -e

        python3 -m specargo.objstore get --key "runs/$PIPELINE_RUN_ID/{{inputs.parameters.partition}}/clean.jsonl" --file
        ''/output/clean/{{inputs.parameters.partition}}.jsonl''

        cat > /tmp/gate_config.json <<''JSON''

        {

        "file_nonempty": {

        "min_bytes": 1

        },

        "row_count": {

        "min": 1

        }

        }

        JSON

        python3 -m specargo.pipeline_cli gate --stage clean --artifact ''/output/clean/{{inputs.parameters.partition}}.jsonl''
        --checks ''["file_nonempty", "row_count"]'' --check-config-file /tmp/gate_config.json --run-id "$PIPELINE_RUN_ID"

        '
      env:
      - name: PIPELINE_RUN_ID
        value: '{{workflow.name}}'
      - name: OBJSTORE_ENDPOINT
        value: http://object-store.argo.svc.cluster.local:5000
      volumeMounts: *id001
  - name: shard
    inputs:
      parameters:
      - name: partition
      - name: dataset
      - name: variant
    timeout: 120s
    container:
      image: specargo:ci
      imagePullPolicy: Never
      command:
      - sh
      - -c
      args:
      - 'set -e

        # 路径契约：从上游产物取数（经对象存储，与节点无关）

        python3 -m specargo.objstore get --key "runs/$PIPELINE_RUN_ID/{{inputs.parameters.partition}}/clean.jsonl" --file
        ''/output/clean/{{inputs.parameters.partition}}.jsonl''

        python3 -m specargo.examples.dataset_steps shard --in /output/clean/{{inputs.parameters.partition}}.jsonl --out-dir
        /output/shards/{{inputs.parameters.partition}} --shards {{workflow.parameters.shards}} --manifest /output/manifest/{{inputs.parameters.partition}}.json
        --dataset raw_partition --version {{workflow.name}} --base-dir /output && python3 -m specargo.examples.manifest verify
        --manifest /output/manifest/{{inputs.parameters.partition}}.json --base-dir /output

        # 路径契约：上游只负责把产物写到约定 key，不依赖编排器的 artifact 配对

        python3 -m specargo.objstore put --key "runs/$PIPELINE_RUN_ID/{{inputs.parameters.partition}}/manifest.jsonl" --file
        ''/output/manifest/{{inputs.parameters.partition}}.json'''
      env:
      - name: PIPELINE_RUN_ID
        value: '{{workflow.name}}'
      - name: OBJSTORE_ENDPOINT
        value: http://object-store.argo.svc.cluster.local:5000
      volumeMounts: *id001
    retryStrategy:
      limit: '0'
      retryPolicy: OnFailure
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 10m
  - name: gate-shard
    inputs:
      parameters:
      - name: partition
      - name: dataset
      - name: variant
    timeout: 5m
    retryStrategy:
      limit: '0'
    container:
      image: specargo:ci
      imagePullPolicy: Never
      command:
      - sh
      - -c
      args:
      - 'set -e

        python3 -m specargo.objstore get --key "runs/$PIPELINE_RUN_ID/{{inputs.parameters.partition}}/manifest.jsonl" --file
        ''/output/manifest/{{inputs.parameters.partition}}.json''

        cat > /tmp/gate_config.json <<''JSON''

        {

        "file_nonempty": {

        "min_bytes": 2

        },

        "json_schema": {

        "required": [

        "dataset",

        "version",

        "shard_count",

        "rows",

        "shards"

        ]

        }

        }

        JSON

        python3 -m specargo.pipeline_cli gate --stage shard --artifact ''/output/manifest/{{inputs.parameters.partition}}.json''
        --checks ''["file_nonempty", "json_schema"]'' --check-config-file /tmp/gate_config.json --run-id "$PIPELINE_RUN_ID"

        '
      env:
      - name: PIPELINE_RUN_ID
        value: '{{workflow.name}}'
      - name: OBJSTORE_ENDPOINT
        value: http://object-store.argo.svc.cluster.local:5000
      volumeMounts: *id001
  podGC:
    strategy: OnWorkflowSuccess
  arguments:
    parameters:
    - name: python
      value: python3
    - name: state_db
      value: ''
    - name: work_dir
      value: /output
    - name: shards
      value: '2'
