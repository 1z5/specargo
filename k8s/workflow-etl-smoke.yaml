apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: etl-smoke
  namespace: argo
spec:
  entrypoint: main
  activeDeadlineSeconds: 600
  podGC:
    strategy: OnWorkflowSuccess
  ttlStrategy:
    secondsAfterCompletion: 3600
  arguments:
    parameters:
    - name: run-id
      value: '{{workflow.name}}'
  volumes:
  - name: output
    hostPath:
      path: /tmp/ci/output
      type: DirectoryOrCreate
  templates:
  - name: main
    dag:
      tasks:
      - name: extract
        template: extract
        withParam: '["1", "2", "3"]'
        arguments:
          parameters:
          - name: partition
            value: '{{item}}'
          - name: run-id
            value: '{{workflow.parameters.run-id}}'
      - name: transform
        template: transform
        dependencies:
        - extract
        withParam: '["1", "2", "3"]'
        arguments:
          parameters:
          - name: partition
            value: '{{item}}'
          - name: run-id
            value: '{{workflow.parameters.run-id}}'
      - name: load
        template: load
        dependencies:
        - transform
        withParam: '["1", "2", "3"]'
        arguments:
          parameters:
          - name: partition
            value: '{{item}}'
          - name: run-id
            value: '{{workflow.parameters.run-id}}'
      - name: validate
        template: validate
        dependencies:
        - load
        withParam: '["1", "2", "3"]'
        arguments:
          parameters:
          - name: partition
            value: '{{item}}'
  - name: extract
    inputs:
      parameters:
      - name: partition
      - name: run-id
    timeout: 5m
    retryStrategy:
      limit: '2'
      retryPolicy: OnTransientError
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
    container:
      image: tts-argo:ci
      imagePullPolicy: Never
      command:
      - python3
      args:
      - /app/etl_steps.py
      - extract
      - --partition={{inputs.parameters.partition}}
      - --out=/output/extract/{{inputs.parameters.partition}}.jsonl
      env:
      - name: TTS_RUN_ID
        value: '{{inputs.parameters.run-id}}'
      volumeMounts:
      - name: output
        mountPath: /output
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
  - name: transform
    inputs:
      parameters:
      - name: partition
      - name: run-id
    timeout: 5m
    retryStrategy:
      limit: '0'
    container:
      image: tts-argo:ci
      imagePullPolicy: Never
      command:
      - python3
      args:
      - /app/etl_steps.py
      - transform
      - --in=/output/extract/{{inputs.parameters.partition}}.jsonl
      - --out=/output/transform/{{inputs.parameters.partition}}.jsonl
      env:
      - name: TTS_RUN_ID
        value: '{{inputs.parameters.run-id}}'
      volumeMounts:
      - name: output
        mountPath: /output
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
  - name: load
    inputs:
      parameters:
      - name: partition
      - name: run-id
    timeout: 5m
    retryStrategy:
      limit: '2'
      retryPolicy: OnTransientError
    container:
      image: tts-argo:ci
      imagePullPolicy: Never
      command:
      - python3
      args:
      - /app/etl_steps.py
      - load
      - --in=/output/transform/{{inputs.parameters.partition}}.jsonl
      - --out=/output/load/{{inputs.parameters.partition}}.done
      env:
      - name: TTS_RUN_ID
        value: '{{inputs.parameters.run-id}}'
      volumeMounts:
      - name: output
        mountPath: /output
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
  - name: validate
    inputs:
      parameters:
      - name: partition
    timeout: 2m
    retryStrategy:
      limit: '0'
    container:
      image: tts-argo:ci
      imagePullPolicy: Never
      command:
      - python3
      - -c
      args:
      - "import sys\nsys.path.insert(0, \"/app\")\nfrom pathlib import Path\nfrom checks import run_check\n\nartifact = Path(\"\
        /output/transform/{{inputs.parameters.partition}}.jsonl\")\nresult = run_check(\"row_count\", artifact, {\"expect\"\
        : 50}, {})\nprint(f\"[validate] partition={{inputs.parameters.partition}} \"\n      f\"passed={result.passed} metric={result.metric}\
        \ {result.detail}\")\nsys.exit(0 if result.passed else 1)\n"
      volumeMounts:
      - name: output
        mountPath: /output
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
  - name: on-exit
    container:
      image: tts-argo:ci
      imagePullPolicy: Never
      command:
      - python3
      - -c
      args:
      - 'import os, time

        from pathlib import Path

        out = Path("/output")

        out.mkdir(parents=True, exist_ok=True)

        marker = out / f"run-{os.environ.get(''TTS_RUN_ID'',''unknown'')}.done"

        marker.write_text(f"finished at {time.time()}\n", encoding="utf-8")

        print(f"[onExit] 收口完成 -> {marker}")

        '
      env:
      - name: TTS_RUN_ID
        value: '{{workflow.parameters.run-id}}'
      volumeMounts:
      - name: output
        mountPath: /output
  onExit: on-exit
