# ⚠️ 文档级示例（未在 CI 部署）
# 这是 TTS 管线的 Argo 版本，用于说明 stage/依赖/重试/artifact 的写法。
# 它引用 registry.example.com 镜像与 tts-state/output/books 三个 PVC，
# 需要自备镜像与存储才能跑；CI 只对它做 argo lint schema 校验。
# 已在集群实测的版本见 k8s/workflow-etl-smoke.yaml。
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: tts-batch
  namespace: data-platform
spec:
  entrypoint: main
  serviceAccountName: argo-workflow
  activeDeadlineSeconds: 14400
  podGC:
    strategy: OnWorkflowSuccess
  ttlStrategy:
    secondsAfterCompletion: 86400
  artifactGC:
    strategy: OnWorkflowCompletion
  arguments:
    parameters:
    - name: book-slugs
      value: book_a,book_b
    - name: voice
      value: cedar
    - name: run-id
      value: '{{workflow.name}}'
  volumes:
  - name: state
    persistentVolumeClaim:
      claimName: tts-state-pvc
  - name: output
    persistentVolumeClaim:
      claimName: tts-output-pvc
  - name: books
    persistentVolumeClaim:
      claimName: tts-books-pvc
  templates:
  - name: main
    dag:
      tasks:
      - name: generate
        template: gen-book
        withParam: '{{workflow.parameters.book-slugs}}'
        arguments:
          parameters:
          - name: slug
            value: '{{item}}'
          - name: voice
            value: '{{workflow.parameters.voice}}'
          - name: run-id
            value: '{{workflow.parameters.run-id}}'
      - name: verify
        template: verify-book
        dependencies:
        - generate
        arguments:
          parameters:
          - name: slug
            value: '{{item}}'
          - name: voice
            value: '{{workflow.parameters.voice}}'
          - name: run-id
            value: '{{workflow.parameters.run-id}}'
      - name: fix
        template: fix-book
        dependencies:
        - verify
        when: '{{tasks.verify.outputs.parameters.status}} == fail'
        arguments:
          parameters:
          - name: slug
            value: '{{item}}'
          - name: voice
            value: '{{workflow.parameters.voice}}'
          - name: run-id
            value: '{{workflow.parameters.run-id}}'
      - name: reconcile
        template: reconcile-book
        dependencies:
        - fix
        arguments:
          parameters:
          - name: slug
            value: '{{item}}'
          - name: voice
            value: '{{workflow.parameters.voice}}'
          - name: run-id
            value: '{{workflow.parameters.run-id}}'
  - name: gen-book
    timeout: 30m
    retryStrategy:
      limit: '3'
      retryPolicy: OnTransientError
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 10m
    synchronization:
      semaphores:
      - configMapKeyRef:
          name: tts-book-lock
          key: '{{inputs.parameters.slug}}'
    inputs:
      parameters:
      - name: slug
      - name: voice
      - name: run-id
    container:
      image: registry.example.com/data/tts:v1
      command:
      - python
      - pipeline.py
      args:
      - --book={{inputs.parameters.slug}}.json
      - --voice={{inputs.parameters.voice}}
      env:
      - name: TTS_RUN_ID
        value: '{{inputs.parameters.run-id}}'
      - name: TTS_STATE_DB
        value: /state/tts_state.db
      - name: TTS_OUTPUT_DIR
        value: /output
      - name: TTS_BOOKS_DIR
        value: /books
      - name: TTS_MAX_RETRIES
        value: '1'
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: tts-secrets
            key: openai-api-key
      volumeMounts:
      - name: state
        mountPath: /state
      - name: output
        mountPath: /output
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: '1'
          memory: 1Gi
    outputs:
      parameters:
      - name: generated-count
        valueFrom:
          path: /argo/outputs/parameters/generated-count
  - name: verify-book
    timeout: 20m
    retryStrategy:
      limit: '0'
    inputs:
      parameters:
      - name: slug
      - name: voice
      - name: run-id
    container:
      image: registry.example.com/data/tts:v1
      command:
      - python
      - verify_audio.py
      args:
      - /output/{{inputs.parameters.slug}}
      - --run-id={{inputs.parameters.run-id}}
      - --state-db=/state/tts_state.db
      - --min-accuracy=0.90
      env:
      - name: TTS_RUN_ID
        value: '{{inputs.parameters.run-id}}'
      - name: TTS_OUTPUT_DIR
        value: /output
      volumeMounts:
      - name: state
        mountPath: /state
      - name: output
        mountPath: /output
      resources:
        requests:
          cpu: '1'
          memory: 2Gi
        limits:
          cpu: '2'
          memory: 4Gi
    outputs:
      parameters:
      - name: status
        valueFrom:
          path: /argo/outputs/parameters/status
      - name: fail-count
        valueFrom:
          path: /argo/outputs/parameters/fail-count
      - name: missing-count
        valueFrom:
          path: /argo/outputs/parameters/missing-count
  - name: fix-book
    timeout: 30m
    retryStrategy:
      limit: '2'
      retryPolicy: OnTransientError
    inputs:
      parameters:
      - name: slug
      - name: voice
      - name: run-id
    container:
      image: registry.example.com/data/tts:v1
      command:
      - python
      - verify_audio.py
      args:
      - /output/{{inputs.parameters.slug}}
      - --fix
      - --fix-retries=3
      - --run-id={{inputs.parameters.run-id}}
      - --state-db=/state/tts_state.db
      env:
      - name: TTS_RUN_ID
        value: '{{inputs.parameters.run-id}}'
      - name: OPENAI_API_KEY
        valueFrom:
          secretKeyRef:
            name: tts-secrets
            key: openai-api-key
      volumeMounts:
      - name: state
        mountPath: /state
      - name: output
        mountPath: /output
      resources:
        requests:
          cpu: '1'
          memory: 2Gi
        limits:
          cpu: '2'
          memory: 4Gi
  - name: reconcile-book
    inputs:
      parameters:
      - name: slug
      - name: voice
      - name: run-id
    container:
      image: registry.example.com/data/tts:v1
      command:
      - python
      - summary.py
      args:
      - --state-db=/state/tts_state.db
      - --books=/books/{{inputs.parameters.slug}}.json
      - --voice={{inputs.parameters.voice}}
      - --run-id={{inputs.parameters.run-id}}
      - --report=/output/reconcile-{{inputs.parameters.slug}}.md
      env:
      - name: TTS_OUTPUT_DIR
        value: /output
      volumeMounts:
      - name: state
        mountPath: /state
      - name: output
        mountPath: /output
      - name: books
        mountPath: /books
    outputs:
      parameters:
      - name: ok
        valueFrom:
          path: /argo/outputs/parameters/ok
      - name: missing
        valueFrom:
          path: /argo/outputs/parameters/missing
  - name: on-exit
    container:
      image: registry.example.com/data/tts:v1
      command:
      - python
      - notify.py
      args:
      - --run-id={{workflow.parameters.run-id}}
      env:
      - name: TTS_STATE_DB
        value: /state/tts_state.db
      volumeMounts:
      - name: state
        mountPath: /state
  onExit: on-exit
