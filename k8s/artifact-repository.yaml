# Argo 的 artifact repository 配置：让 workflow 的 artifacts 走对象存储。
#
# ⚠️ v3.x 的关键细节：仅有 ConfigMap 不够，必须加
#    workflows.argoproj.io/default-artifact-repository 注解，
#    控制器靠它知道"哪个 key 是默认仓库"。缺了这个注解，
#    executor 会报 "You need to configure artifact storage"（exit 64）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-repositories
  namespace: argo
  annotations:
    workflows.argoproj.io/default-artifact-repository: default
data:
  default: |
    s3:
      bucket: argo-artifacts
      endpoint: object-store.argo.svc.cluster.local:5000
      insecure: true                 # 集群内 HTTP，不走 TLS
      accessKeySecret:
        name: argo-artifacts
        key: accesskey
      secretKeySecret:
        name: argo-artifacts
        key: secretkey
